<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabel Kasus Covid-19 - Kabupaten Yogyakarta</title>
<style>
  :root{
    --merah:#b00000; --merah-tua:#7a0000; --krem:#fff2cc; --kuning:#ffe699;
    --latar:#fbe9e0; --teks:#3b1a14;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px 12px;font-family:"Segoe UI",Arial,sans-serif;color:var(--teks);
    background:linear-gradient(135deg,#ffd9c7 0%,#fbe9e0 45%,#ffe9a8 100%);min-height:100vh}
  .halaman{max-width:980px;margin:0 auto;background:#fffaf4;border:2px solid var(--merah-tua);
    border-radius:6px;overflow:hidden;box-shadow:0 8px 24px rgba(122,0,0,.25)}
  .topbar{background:var(--merah-tua);text-align:right;padding:8px 18px}
  .topbar a{color:#fff;font-weight:700;text-decoration:none}
  .topbar a:hover{text-decoration:underline}
  header{display:flex;align-items:center;gap:24px;padding:18px 24px;
    background:linear-gradient(90deg,var(--kuning),var(--krem));border-bottom:3px solid var(--merah)}
  .logo{width:110px;height:auto;flex:none;filter:drop-shadow(0 3px 4px rgba(122,0,0,.35))}
  header h1{margin:0;font-size:clamp(24px,4.5vw,42px);letter-spacing:.5px;color:var(--merah-tua)}
  header p{margin:2px 0 0;font-style:italic;font-size:clamp(18px,3vw,30px)}
  .isi{display:flex}
  main{flex:1;padding:16px;min-width:0}
  .gulir{overflow-x:auto}
  table{width:100%;border-collapse:collapse;text-align:center;font-size:17px;min-width:560px}
  th{background:var(--merah);color:#fff;padding:10px;border:2px solid #fffaf4}
  td{padding:9px 10px;border:2px solid #fffaf4}
  tbody tr:nth-child(odd) td{background:var(--krem)}
  tbody tr:nth-child(even) td{background:#ffd966}
  td.wilayah{text-align:left;font-weight:600}
  tr.persen td{font-weight:600}
  tbody tr:hover td{filter:brightness(.96)}
  footer{text-align:center;padding:16px;background:linear-gradient(90deg,var(--krem),var(--kuning));
    border-top:3px solid var(--merah);font-size:14px;line-height:1.5}
  footer strong{display:block;font-size:26px;font-style:italic;color:var(--merah)}
  #akun{color:#ffe699;margin-right:14px;font-size:14px}
  dialog{border:2px solid var(--merah-tua);border-radius:8px;padding:0;width:min(360px,92vw);background:#fffaf4;color:var(--teks)}
  dialog::backdrop{background:rgba(59,26,20,.55)}
  dialog h3{margin:0;padding:14px 18px;background:var(--merah);color:#fff;font-size:18px}
  dialog form{padding:18px;display:grid;gap:12px}
  dialog label{display:grid;gap:4px;font-weight:600;font-size:14px}
  dialog input{padding:9px 10px;border:2px solid #e0b89f;border-radius:5px;font-size:16px;background:#fff}
  dialog input:focus{outline:none;border-color:var(--merah)}
  .aksi{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .aksi button{padding:9px 18px;border-radius:5px;font-size:15px;font-weight:600;cursor:pointer;border:2px solid var(--merah)}
  .btn-masuk{background:var(--merah);color:#fff}
  .btn-masuk:hover{background:var(--merah-tua)}
  .btn-batal{background:#fff;color:var(--merah)}
  #pesan{color:var(--merah);font-size:13px;min-height:1em;margin:0}
  @media(max-width:640px){
    .isi{flex-direction:column}
    header{flex-direction:column;text-align:center}
  }
</style>
</head>

    <div>
      <h1>TABEL KASUS COVID-19</h1>
      <p>KABUPATEN YOGYAKARTA</p>
    </div>
  </header>

  <div class="isi">

    <main>
      <div class="gulir">
        <table>
          <thead>
            <tr>
              <th rowspan="2">No.</th>
              <th rowspan="2">Wilayah</th>
              <th rowspan="2">Jumlah</th>
              <th colspan="3">Kategori</th>
            </tr>
            <tr>
              <th>Konfirmasi Covid-19</th>
              <th>Sembuh</th>
              <th>Meninggal</th>
            </tr>
          </thead>
          <tbody id="isi-tabel"></tbody>
        </table>
      </div>
    </main>
  </div>

  <footer>
    <strong>yogyakarta</strong>
    Pemerintah Kabupaten Yogyakarta<br>
    Jl. Parasamya, Yogyakarta, Daerah Istimewa Yogyakarta Kode Pos 55511 Telp (0274) 868405
  </footer>
</div>

<dialog id="dialog-login">
  <h3>Login</h3>
  <form id="form-login" method="dialog">
    <label>Email
      <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" id="password" placeholder="Password" required minlength="6" autocomplete="current-password">
    </label>
    <p id="pesan"></p>
    <div class="aksi">
      <button type="button" class="btn-batal" id="batal">Batal</button>
      <button type="submit" class="btn-masuk">Masuk</button>
    </div>
  </form>
</dialog>

<script>
  // Data dari gambar (2) — ubah di sini jika perlu
  const data = [
    { wilayah: "Kota Yogyakarta", kasus: ["34.840", "33.545", "1.162"], persen: ["100", "96.24", "3.34"] },
    { wilayah: "Prop. DIY",       kasus: ["223.740", "217.130", "5.924"], persen: ["100", "97.05", "2.65"] },
    { wilayah: "Nasional",        kasus: ["6.343.076", "6.137.394", "157.493"], persen: ["100", "8.80", "0.23"] }
  ];

  const tbody = document.getElementById("isi-tabel");
  data.forEach((d, i) => {
    tbody.insertAdjacentHTML("beforeend", `
      <tr>
        <td rowspan="2">${i + 1}</td>
        <td rowspan="2" class="wilayah">${d.wilayah}</td>
        <td>Kasus</td>
        ${d.kasus.map(k => `<td>${k}</td>`).join("")}
      </tr>
      <tr class="persen">
        <td>%</td>
        ${d.persen.map(p => `<td>${p}</td>`).join("")}
      </tr>`);
  });

  // Login (demo tampilan saja, belum terhubung ke server)
  const dialog = document.getElementById("dialog-login");
  const tombol = document.getElementById("tombol-login");
  const akun = document.getElementById("akun");
  const pesan = document.getElementById("pesan");
  let emailMasuk = null;

  tombol.addEventListener("click", e => {
    e.preventDefault();
    if (emailMasuk) {           // sedang login -> logout
      emailMasuk = null;
      akun.textContent = "";
      tombol.textContent = "login";
    } else {
      pesan.textContent = "";
      dialog.showModal();
    }
  });
  document.getElementById("batal").addEventListener("click", () => dialog.close());
  document.getElementById("form-login").addEventListener("submit", e => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    emailMasuk = email;
    akun.textContent = email;
    tombol.textContent = "logout";
    document.getElementById("form-login").reset();
    dialog.close();
  });
</script>
</body>
